version: "3.9"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: maskan_app
      POSTGRES_PASSWORD: maskan_secret
      POSTGRES_DB: maskan
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maskan_app -d maskan"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  # ── Redis (cache, rate limiting, locks, idempotency, Celery broker) ─────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # Host-bound to localhost only, for local debugging (redis-cli) — never
    # exposed on 0.0.0.0. Nothing outside this compose network can reach it.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    logging: *default-logging

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: development
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      DATABASE_URL: postgresql://maskan_app:maskan_secret@db:5432/maskan
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGIN: http://localhost:5173
      SECRET_KEY: dev-secret-change-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-mnaushad.fms@gmail.com}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      WATCHFILES_FORCE_POLLING: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  # ── Celery worker — all queues (single consolidated worker at this scale;
  #    see DEPLOY.md for how to split into one container per queue later) ────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: development
      DATABASE_URL: postgresql://maskan_app:maskan_secret@db:5432/maskan
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-change-in-production
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-mnaushad.fms@gmail.com}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    volumes:
      - ./backend:/app
    command: >
      celery -A app.core.celery_app worker
      -Q default,notifications,data_ingestion,ai,analytics,payments,scheduled_jobs
      -l info --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    logging: *default-logging

  # ── React / TanStack frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
